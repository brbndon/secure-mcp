version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-development:
        dependency-type: development
      npm-production:
        dependency-type: production
  - package-ecosystem: npm
    directory: /fixtures/tiny-app
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
  - package-ecosystem: npm
    directory: /fixtures/tiny-expo
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
  - package-ecosystem: npm
    directory: /fixtures/rn-lib-no-expo
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
