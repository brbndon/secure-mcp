name: Feature request
description: Propose a defensive tool, stack pack, or workflow improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What defensive review gap or contributor workflow problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe expected inputs, outputs, and where it fits in the audit workflow.
    validations:
      required: true
  - type: textarea
    id: trust_model
    attributes:
      label: Trust-model considerations
      description: Note filesystem, redaction, output-safety, compatibility, or data-handling implications.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This proposal is defensive and remediation-focused.
          required: true
